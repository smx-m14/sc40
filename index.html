<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2a3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style"   content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Super Cait's 40</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" href="vendor/phaser.min.js" as="script">
  <link rel="preload" href="fonts/vt323.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Pantalla de carga: se pinta al instante (estilo en línea, sin esperar a nada) mientras se descarga el motor del
       juego; main.js la quita al aparecer el título. Huellitas que van andando, dibujadas en píxeles con box-shadow. -->
  <style>
    #loader { position: fixed; inset: 0; z-index: 100; background: #1b2a3a; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px; transition: opacity .3s; }
    #loader.out { opacity: 0; pointer-events: none; }
    #loader .steps { display: flex; gap: 22px; align-items: flex-end; height: 120px; }
    #loader .paw { width: 64px; height: 56px; position: relative; opacity: 0; animation: lpaw 1.6s steps(1) infinite; }
    #loader .paw:nth-child(odd) { margin-bottom: 36px; }
    #loader .paw:nth-child(2) { animation-delay: .25s; } #loader .paw:nth-child(3) { animation-delay: .5s; }
    #loader .paw:nth-child(4) { animation-delay: .75s; }
    #loader .paw::before { content: ''; position: absolute; left: 0; top: 0; width: 4px; height: 4px; background: transparent;
      box-shadow: 16px 0px #fff6dc,20px 0px #fff6dc,40px 0px #fff6dc,44px 0px #fff6dc,12px 4px #fff6dc,16px 4px #fff6dc,20px 4px #fff6dc,24px 4px #fff6dc,36px 4px #fff6dc,40px 4px #fff6dc,44px 4px #fff6dc,48px 4px #fff6dc,12px 8px #fff6dc,16px 8px #fff6dc,20px 8px #fff6dc,24px 8px #fff6dc,36px 8px #fff6dc,40px 8px #fff6dc,44px 8px #fff6dc,48px 8px #fff6dc,12px 12px #fff6dc,16px 12px #fff6dc,20px 12px #fff6dc,24px 12px #fff6dc,36px 12px #fff6dc,40px 12px #fff6dc,44px 12px #fff6dc,48px 12px #fff6dc,16px 16px #fff6dc,20px 16px #fff6dc,40px 16px #fff6dc,44px 16px #fff6dc,4px 20px #fff6dc,8px 20px #fff6dc,52px 20px #fff6dc,56px 20px #fff6dc,0px 24px #fff6dc,4px 24px #fff6dc,8px 24px #fff6dc,12px 24px #fff6dc,48px 24px #fff6dc,52px 24px #fff6dc,56px 24px #fff6dc,60px 24px #fff6dc,0px 28px #fff6dc,4px 28px #fff6dc,8px 28px #fff6dc,12px 28px #fff6dc,24px 28px #fff6dc,28px 28px #fff6dc,32px 28px #fff6dc,36px 28px #fff6dc,48px 28px #fff6dc,52px 28px #fff6dc,56px 28px #fff6dc,60px 28px #fff6dc,4px 32px #fff6dc,8px 32px #fff6dc,20px 32px #fff6dc,24px 32px #fff6dc,28px 32px #fff6dc,32px 32px #fff6dc,36px 32px #fff6dc,40px 32px #fff6dc,52px 32px #fff6dc,56px 32px #fff6dc,16px 36px #fff6dc,20px 36px #fff6dc,24px 36px #fff6dc,28px 36px #fff6dc,32px 36px #fff6dc,36px 36px #fff6dc,40px 36px #fff6dc,44px 36px #fff6dc,12px 40px #fff6dc,16px 40px #fff6dc,20px 40px #fff6dc,24px 40px #fff6dc,28px 40px #fff6dc,32px 40px #fff6dc,36px 40px #fff6dc,40px 40px #fff6dc,44px 40px #fff6dc,48px 40px #fff6dc,12px 44px #fff6dc,16px 44px #fff6dc,20px 44px #fff6dc,24px 44px #fff6dc,28px 44px #fff6dc,32px 44px #fff6dc,36px 44px #fff6dc,40px 44px #fff6dc,44px 44px #fff6dc,48px 44px #fff6dc,12px 48px #fff6dc,16px 48px #fff6dc,20px 48px #fff6dc,24px 48px #fff6dc,28px 48px #fff6dc,32px 48px #fff6dc,36px 48px #fff6dc,40px 48px #fff6dc,44px 48px #fff6dc,48px 48px #fff6dc,16px 52px #fff6dc,20px 52px #fff6dc,24px 52px #fff6dc,36px 52px #fff6dc,40px 52px #fff6dc,44px 52px #fff6dc; }
    #loader .bar { width: 148px; height: 12px; border: 3px solid #fff6dc; padding: 2px; }
    #loader .bar i { display: block; height: 100%; width: 30%; background: #e2574c; animation: lbar 1.1s steps(8) infinite alternate; }
    @media (max-width: 400px) { #loader .steps { transform: scale(.75); } }
    @keyframes lpaw { 0% { opacity: 0; } 10% { opacity: 1; } 70% { opacity: .35; } 85% { opacity: 0; } }
    @keyframes lbar { from { margin-left: 0; } to { margin-left: 70%; } }
  </style>
</head>
<body>
  <div id="loader" aria-label="Cargando"><div class="steps"><div class="paw"></div><div class="paw"></div><div class="paw"></div><div class="paw"></div></div><div class="bar"><i></i></div></div>
  <div id="stage">
    <div id="game"></div>

    <div id="overlay">
      <!-- HUD -->
      <div id="hud" class="hidden">
        <div class="hud-left">
          <span class="chip" title="Calcetines">🧦 <b id="hud-socks">0</b></span>
          <span class="chip" title="Monedas de gachapón">🪙 <b id="hud-coins">0</b></span>
          <span class="chip" title="Invitaciones entregadas">💌 <b id="hud-inv">0</b></span>
        </div>
        <div class="hud-right">
          <button id="btn-mute" class="chip btn" aria-label="Sonido">🔊</button>
          <button id="btn-menu" class="chip btn" aria-label="Menú">☰</button>
        </div>
      </div>

      <div id="zone" class="hidden"></div>
      <div id="toast" class="hidden"></div>
      <div id="cue" class="hidden"></div>

      <!-- Barra de minijuego -->
      <div id="minibar" class="hidden">
        <span id="minibar-text"></span>
        <span class="minibar-btns">
          <button id="mb-win" class="btn hidden">⏭ Ganar</button>
          <button id="mb-undo" class="btn">↩ Deshacer</button>
          <button id="mb-reset" class="btn">⟲ Reiniciar</button>
          <button id="mb-exit" class="btn">✕ Salir</button>
        </span>
      </div>

      <!-- Diálogo -->
      <div id="dialog" class="hidden">
        <div id="dialog-name"></div>
        <img id="dialog-img" class="hidden" alt="">
        <div id="dialog-text"></div>
        <div id="dialog-choices"></div>
        <div id="dialog-next">▼</div>
      </div>

      <!-- Entrada de texto (reclamaciones) -->
      <div id="prompt" class="panel hidden">
        <div id="prompt-title"></div>
        <textarea id="prompt-input" maxlength="300" rows="4"></textarea>
        <div class="row">
          <button id="prompt-cancel" class="btn">Cancelar</button>
          <button id="prompt-ok" class="btn primary">Enviar</button>
        </div>
      </div>

      <!-- Candado de cifras -->
      <div id="code" class="panel hidden">
        <div id="code-title"></div>
        <div id="code-digits"></div>
        <div class="row">
          <button id="code-cancel" class="btn">Cancelar</button>
          <button id="code-ok" class="btn primary">Abrir</button>
        </div>
      </div>

      <!-- Prueba de oído de Fucsia -->
      <div id="quiz" class="panel hidden">
        <div class="quiz-head"><b>Prueba de oído de Fucsia</b><span id="quiz-n"></span><span id="quiz-score"></span></div>
        <div class="quiz-track"><div id="quiz-bar"></div></div>
        <div id="quiz-msg"></div>
        <div id="quiz-typing">
          <input id="quiz-input" type="text" maxlength="60" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Título de la canción">
          <button id="quiz-ok" class="btn primary">Responder</button>
        </div>
        <div id="quiz-options" class="hidden"></div>
        <div class="quiz-foot">
          <button id="quiz-replay" class="btn">Oír otra vez</button>
          <button id="quiz-hint" class="btn">Pista</button>
          <span id="quiz-worth"></span>
          <button id="quiz-win" class="btn hidden">Ganar</button>
          <button id="quiz-exit" class="btn">Salir</button>
        </div>
      </div>

      <!-- Menú -->
      <div id="menu" class="panel hidden">
        <div class="tabs">
          <button class="tab btn active" data-tab="prep">Preparativos</button>
          <button class="tab btn" data-tab="amigos">Amigos</button>
          <button class="tab btn" data-tab="cosas">Cosas</button>
          <button class="tab btn" data-tab="ajustes">Ajustes</button>
          <button class="tab btn hidden" data-tab="debug" id="tab-debug">🛠</button>
          <button id="menu-close" class="btn">✕</button>
        </div>
        <div id="menu-body"></div>
      </div>

      <!-- Libro de los Miausis -->
      <div id="album" class="hidden">
        <div class="album-title">📖 Libro de los Miausis <span id="album-page"></span></div>
        <div class="album-row">
          <button id="album-prev" class="btn">◀</button>
          <div id="album-photo">
            <img id="album-img" alt="">
            <div class="album-cap"><b id="album-place"></b> · <span id="album-date"></span></div>
            <div id="album-deco"></div>
          </div>
          <button id="album-next" class="btn">▶</button>
        </div>
        <button id="album-close" class="btn">✕ Cerrar</button>
      </div>

      <!-- Final -->
      <div id="ending" class="hidden">
        <div class="ending-box">
          <div class="ending-big">¡Feliz cumpleaños, Cait!</div>
          <div class="ending-msg">¡Muchas gracias por dejarnos formar parte de tu universo!</div>
          <div id="ending-stats"></div>
          <button id="ending-ok" class="btn primary">Seguir jugando</button>
        </div>
      </div>

      <!-- Título -->
      <div id="title" class="hidden">
        <div class="title-box">
          <div class="title-small">SUPER</div>
          <div class="title-big">CAIT'S <span>40</span></div>
          <div class="title-btns">
            <button id="t-continue" class="btn primary hidden">Continuar</button>
            <button id="t-new" class="btn">Nueva partida</button>
          </div>
          <div class="title-foot">Flechas / WASD: moverse · Espacio: hablar · Esc: menú</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Controles táctiles -->
  <div id="touch" class="hidden">
    <div id="dpad">
      <button data-dir="up" class="d up">▲</button>
      <button data-dir="left" class="d left">◀</button>
      <button data-dir="right" class="d right">▶</button>
      <button data-dir="down" class="d down">▼</button>
    </div>
    <div id="abtns">
      <button id="tb-a" class="ab a" aria-label="Acción">{pawbtn}</button>
    </div>
  </div>

  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
